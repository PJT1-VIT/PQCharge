<!doctype html>
<!--
  PQCharge results page — Track C, Phase C6.

  Opened two ways, same file:
    1. by double-click from analysis/output/  -> data comes from results.js
    2. served by the dashboard (C7)            -> data comes from results.json,
                                                  and the page refreshes itself
                                                  when a new run is analysed
  Everything it needs is local (no internet): ECharts is in vendor/.
  Add ?png to the address to export charts as PNG instead of SVG.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQCharge Results</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --mode-classical: #2a78d6;
    --mode-hybrid: #eb6834;
    --mode-pqc: #1baf7a;
    --mode-other: #4a3aa7;
    --series-alt: #4a3aa7;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --good-text: #006300;
    --focus: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --mode-classical: #3987e5;
      --mode-hybrid: #d95926;
      --mode-pqc: #199e70;
      --mode-other: #9085e9;
      --series-alt: #9085e9;
      --good-text: #0ca30c;
      --focus: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --mode-classical: #3987e5;
    --mode-hybrid: #d95926;
    --mode-pqc: #199e70;
    --mode-other: #9085e9;
    --series-alt: #9085e9;
    --good-text: #0ca30c;
    --focus: #3987e5;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: var(--page);
    border-bottom: 1px solid var(--border);
  }
  .bar {
    max-width: 1280px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-weight: 650; font-size: 15px; white-space: nowrap; }
  .brand small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
  nav.sections { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
  nav.sections a {
    text-decoration: none; color: var(--ink-2); padding: 4px 10px; border-radius: 6px;
  }
  nav.sections a:hover { background: var(--border); color: var(--ink); }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  button.theme {
    font: inherit; font-size: 12px; color: var(--ink-2); background: transparent;
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; cursor: pointer;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  section { margin: 0 0 40px; }
  h2 { font-size: 20px; margin: 8px 0 2px; font-weight: 650; }
  .lede { color: var(--ink-2); margin: 0 0 16px; max-width: 900px; }
  h3 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 960px) { .grid.two { grid-template-columns: 1fr 1fr; } }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; min-width: 0;
  }
  .chart { width: 100%; height: 340px; }
  .chart.tall { height: 420px; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .k { color: var(--ink-2); font-size: 12px; }
  .tile .v { font-size: 24px; font-weight: 650; line-height: 1.25; margin-top: 2px; }
  .tile .d { color: var(--muted); font-size: 12px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .badge .i { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 11px; line-height: 1; }
  .badge.pass .i { background: var(--good); }
  .badge.warn .i { background: var(--warning); color: #0b0b0b; }
  .badge.fail .i { background: var(--critical); }
  .badge.info .i { background: var(--muted); }
  details.issues summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
  details.issues ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12px; white-space: normal; max-width: 640px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; max-width: 100%;
  }
  select:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .empty {
    color: var(--ink-2); background: var(--surface); border: 1px dashed var(--axis);
    border-radius: 10px; padding: 18px; margin: 0;
  }
  .empty code, .note code { font-size: 12px; }
  .note { color: var(--ink-2); font-size: 12px; margin: 8px 0 0; }
  .banner { border-radius: 10px; padding: 10px 14px; margin: 0 0 16px; border: 1px solid var(--border); background: var(--surface); }
  footer { max-width: 1280px; margin: 0 auto; padding: 16px; color: var(--muted); font-size: 12px; }
  @media print { header.top { position: static; } .card { break-inside: avoid; } }
</style>
<script>
  // Remembered theme choice: a per-viewer convenience only, and optional.
  try {
    var saved = localStorage.getItem("pqcharge-theme");
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { /* storage unavailable: follow the system setting */ }
</script>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">PQCharge<small>Results</small></div>
    <nav class="sections" aria-label="Sections">
      <a href="#runs">Runs</a>
      <a href="#e1">E1 Handshake</a>
      <a href="#e2">E2 Storm</a>
      <a href="#e3">E3 Migration</a>
      <a href="#e4">E4 Sizes</a>
      <a href="#e5">E5 Security</a>
      <a href="#nodes">Hardware &amp; E6</a>
    </nav>
    <span class="meta" id="generated">loading…</span>
    <button class="theme" id="themeBtn" type="button" title="Switch light / dark">Theme</button>
  </div>
</header>

<main id="root">
  <p class="empty" id="loading">Loading results…</p>
</main>

<footer id="foot"></footer>

<script src="vendor/echarts.min.js"></script>
<script src="results.js" onerror="/* not there when served by the dashboard; results.json is fetched instead */"></script>
<script src="charts.js"></script>
</body>
</html>
